version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: .
    container_name: insurance-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_MODE=development
    volumes:
      - ./:/app
    command: python main.py
    networks:
      - insurance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Streamlit Frontend
  frontend:
    build: .
    container_name: insurance-ai-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://backend:8000
    volumes:
      - ./:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insurance-network

networks:
  insurance-network:
    driver: bridge
